  .anim-sheet{ animation: slideUp .22s cubic-bezier(.32,.72,0,1); }

/* ===== ZMP design system v3 ===== */
:root{--zmp-navy:#0a1433;--zmp-navy2:#12245e;--zmp-blue:#1d4ed8;--zmp-bg:#f3f5f9;--zmp-line:#eef0f4}
body{background:#e9edf4}
.app-shell,.app-shell.bg-gray-50{background:var(--zmp-bg)!important}
.app-shell .bg-gray-50{background-color:var(--zmp-bg)}
.zmp-sheet .bg-gray-50{background-color:#f5f7fb}
/* cards: neutral soft elevation instead of coloured glows */
.app-shell .bg-white.rounded-2xl{box-shadow:0 1px 0 rgba(10,20,51,.04),0 10px 24px -18px rgba(10,20,51,.38)!important}.app-shell .bg-white.rounded-2xl:not([style*="border-left"]){border-color:var(--zmp-line)!important}
.zmp-sheet .bg-white.rounded-2xl{box-shadow:0 0 0 1px var(--zmp-line)!important}
.app-shell .rounded-2xl.border-dashed{box-shadow:none!important;background:transparent}
/* primary brand surfaces */
.bg-brand{background-color:var(--zmp-blue)!important;background-image:linear-gradient(135deg,var(--zmp-navy2) 0%,var(--zmp-blue) 100%)!important}
.bg-brand.rounded-2xl,.bg-brand.rounded-3xl{position:relative;overflow:hidden;background-image:linear-gradient(150deg,var(--zmp-navy) 0%,var(--zmp-navy2) 55%,var(--zmp-blue) 140%)!important;box-shadow:0 16px 30px -20px rgba(10,20,51,.8)!important}
.bg-brand.rounded-2xl::after{content:"";position:absolute;right:-40px;top:-50px;width:150px;height:150px;border-radius:9999px;border:1px solid rgba(255,255,255,.1);pointer-events:none}
.bg-brand.rounded-2xl::before{content:"";position:absolute;right:-6px;top:-16px;width:80px;height:80px;border-radius:9999px;border:1px solid rgba(255,255,255,.08);pointer-events:none}
/* secondary "add" buttons */
.app-shell button.bg-blue-50.text-brand{background:#eef3ff!important;border:1.5px dashed rgba(29,78,216,.35)}
/* inputs */
.app-shell input:not([type=checkbox]):not([type=radio]),.app-shell textarea,.app-shell select,.zmp-sheet input:not([type=checkbox]):not([type=radio]),.zmp-sheet textarea,.zmp-sheet select{border-color:#e3e7ef}
.app-shell input:focus,.app-shell textarea:focus,.app-shell select:focus{border-color:var(--zmp-blue)!important;background:#fff!important;box-shadow:0 0 0 4px rgba(29,78,216,.12)}
/* sheet */
.zmp-sheet{box-shadow:0 -20px 50px -20px rgba(10,20,51,.45)}
.fixed.inset-0 > .absolute.inset-0.bg-black\/40{background:rgba(10,20,51,.45)!important;backdrop-filter:blur(2px);-webkit-backdrop-filter:blur(2px)}
/* header right-slot buttons */
.zmp-hdr-right button{border-radius:12px!important;background:rgba(255,255,255,.1)!important;border:1px solid rgba(255,255,255,.14)}
/* screen transition */
@keyframes zmpScreenIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.zmp-screen{animation:zmpScreenIn .32s cubic-bezier(.22,.8,.3,1) backwards}
.zmp-navpill{transition:background-color .25s ease,color .25s ease,transform .2s ease}
button:active .zmp-navpill{transform:scale(.92)}

/* light-grey controls must stay visible on the new page background */
.app-shell button.bg-gray-100,.app-shell .bg-gray-100.rounded-full,.zmp-sheet button.bg-gray-100{box-shadow:inset 0 0 0 1px #e1e5ee}
.app-shell button.bg-white:not(.rounded-2xl){box-shadow:inset 0 0 0 1px #e3e7ef}
.whitespace-nowrap{white-space:nowrap}
/* ===== animated home header ===== */
.zmp-home-hdr{background:linear-gradient(160deg,#0a1433 0%,#12245e 45%,#1a3c9e 75%,#1d4ed8 100%);background-size:220% 220%;animation:zmpGrad 16s ease-in-out infinite}
@keyframes zmpGrad{0%,100%{background-position:0% 30%}50%{background-position:100% 70%}}
.zmp-orb-a{animation:zmpDriftA 14s ease-in-out infinite}
.zmp-orb-b{animation:zmpDriftB 18s ease-in-out infinite}
@keyframes zmpDriftA{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(70px,-30px) scale(1.18)}}
@keyframes zmpDriftB{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(-60px,40px) scale(1.25)}}
.zmp-ring-a{animation:zmpBreath 7s ease-in-out infinite}
.zmp-ring-b{animation:zmpBreath 5s ease-in-out infinite reverse}
@keyframes zmpBreath{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(1.07);opacity:.45}}
.zmp-ring-dash{animation:zmpSpin 38s linear infinite}
@keyframes zmpSpin{to{transform:rotate(360deg)}}
.zmp-sheen{position:absolute;top:-20%;left:0;width:38%;height:140%;background:linear-gradient(90deg,rgba(255,255,255,0),rgba(255,255,255,.07),rgba(255,255,255,0));transform:translateX(-160%) skewX(-18deg);animation:zmpSheen 9s ease-in-out infinite 1.5s}
@keyframes zmpSheen{0%{transform:translateX(-160%) skewX(-18deg)}35%,100%{transform:translateX(420%) skewX(-18deg)}}
.zmp-dot{position:absolute;bottom:-8px;width:4px;height:4px;border-radius:9999px;background:rgba(191,210,255,.55);pointer-events:none;animation-name:zmpRise;animation-timing-function:linear;animation-iteration-count:infinite}
@keyframes zmpRise{0%{transform:translateY(0);opacity:0}15%{opacity:.9}100%{transform:translateY(-260px);opacity:0}}

/* section headers + summary cards: animated like home */
.zmp-dot-s{animation-name:zmpRiseS}
@keyframes zmpRiseS{0%{transform:translateY(0);opacity:0}20%{opacity:.85}100%{transform:translateY(-110px);opacity:0}}
.bg-brand.rounded-2xl,.bg-brand.rounded-3xl{background-size:220% 220%!important;animation:zmpGrad 16s ease-in-out infinite}
.bg-brand.rounded-2xl::after{animation:zmpBreath 7s ease-in-out infinite}
.bg-brand.rounded-2xl::before{border-style:dashed!important;animation:zmpSpin 40s linear infinite}
@media (prefers-reduced-motion:reduce){.bg-brand.rounded-2xl,.bg-brand.rounded-3xl,.bg-brand.rounded-2xl::after,.bg-brand.rounded-2xl::before{animation:none!important}}
@media (prefers-reduced-motion:reduce){.zmp-home-hdr,.zmp-orb-a,.zmp-orb-b,.zmp-ring-a,.zmp-ring-b,.zmp-ring-dash,.zmp-sheen,.zmp-dot,.zmp-screen{animation:none!important}.zmp-dot,.zmp-sheen{display:none}}
.mb-3\.5{margin-bottom:.875rem}.mt-5{margin-top:1.25rem}.pt-12{padding-top:3rem}.py-3\.5{padding-top:.875rem;padding-bottom:.875rem}

    import("https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm").then(({ createClient }) => {
      const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
      const normalize = (u) => u ? { uid: u.id, email: u.email } : null;
      window.__cloud = {
        signUp: async (email, pw) => { const { error } = await supabase.auth.signUp({ email, password: pw }); if (error) throw error; },
        signIn: async (email, pw) => { const { error } = await supabase.auth.signInWithPassword({ email, password: pw }); if (error) throw error; },
        signOutUser: () => supabase.auth.signOut(),
        onAuth: (cb) => {
          supabase.auth.getSession().then(({ data }) => cb(normalize(data.session && data.session.user)));
          const { data: sub } = supabase.auth.onAuthStateChange((_event, session) => cb(normalize(session && session.user)));
          return () => sub.subscription.unsubscribe();
        },
        getRow: async (uid) => {
          const { data, error } = await supabase.from('app_data').select('data, updated_at').eq('user_id', uid).maybeSingle();
          if (error) throw error;
          return data ? { data: data.data, ts: data.updated_at } : null;
        },
        casUpdate: async (uid, doc, ts) => {
          const { data, error } = await supabase.from('app_data').update({ data: doc, updated_at: new Date().toISOString() }).eq('user_id', uid).eq('updated_at', ts).select('updated_at');
          if (error) throw error;
          return data && data.length ? { ok: true, ts: data[0].updated_at } : { ok: false, conflict: true };
        },
        insertRow: async (uid, doc) => {
          const { data, error } = await supabase.from('app_data').insert({ user_id: uid, data: doc, updated_at: new Date().toISOString() }).select('updated_at');
          if (error) { if (error.code === '23505') return { ok: false, conflict: true }; throw error; }
          return { ok: true, ts: data && data[0] ? data[0].updated_at : null };
        },
        getCloudDoc: async (uid) => {
          const { data, error } = await supabase.from('app_data').select('data').eq('user_id', uid).maybeSingle();
          if (error) throw error;
          return data ? data.data : null;
        },
        setCloudDoc: async (uid, data) => {
          // v2.1: every cloud save goes through the conflict-safe sync engine
          if (window.__zmpSync) { await window.__zmpSync.saveNow('external'); return; }
          const { error } = await supabase.from('app_data').upsert({ user_id: uid, data, updated_at: new Date().toISOString() });
          if (error) throw error;
        },
      };
      supabase.auth.onAuthStateChange((event) => { if (event === 'PASSWORD_RECOVERY') window.dispatchEvent(new Event('__cloud_recovery__')); if (event === 'SIGNED_IN') window.__zmpRecordLogin(); });
      window.__cloud.getCurrentUser = async () => { const { data } = await supabase.auth.getSession(); return normalize(data.session && data.session.user); };
      window.__cloud.resetPasswordForEmail = async (email) => { const { error } = await supabase.auth.resetPasswordForEmail(email, { redirectTo: window.location.origin + window.location.pathname }); if (error) throw error; };
      window.__cloud.updatePassword = async (newPw) => { const { error } = await supabase.auth.updateUser({ password: newPw }); if (error) throw error; };
      window.__cloud.sendResetOtp = async (email) => { const { error } = await supabase.auth.signInWithOtp({ email, options: { shouldCreateUser: false } }); if (error) throw error; };
      window.__cloud.verifyResetOtp = async (email, token) => { const { error } = await supabase.auth.verifyOtp({ email, token, type: 'email' }); if (error) throw error; };
      window.dispatchEvent(new Event('__cloud_ready__'));
    }).catch((e) => { console.warn('Supabase failed to load', e); window.__CLOUD_LOAD_FAILED__ = true; window.dispatchEvent(new Event('__cloud_ready__')); });
  } else {
    window.dispatchEvent(new Event('__cloud_ready__'));
  }
</script>


<script>
(function(){
  'use strict';
  function djb2(t){let e=5381;for(let l=0;l<t.length;l++)e=(e*33^t.charCodeAt(l))>>>0;return e.toString(36);}
  var SYNC_KEYS = ['zmp.catalog.v1','zmp.order.draft.v1','zmp.order.pending.v1','zmp.order.history.v1','zmp.ledger.distributors.v1','zmp.order.distributors.v1','zmp.ledger.customerdue.v1','zmp.ledger.others.v1','zmp.owner.auth.v1','zmp.edit.auth.v1','zmp.owner.investment.v1','zmp.owner.withdrawal.v1','zmp.owner.profit.months.v1','zmp.owner.profit.index.v1'];

  function pushSyncNow(){
    try{
      if(!window.__cloud || !window.__cloud.getCurrentUser) return;
      window.__cloud.getCurrentUser().then(function(u){
        if(!u) return;
        var doc = {};
        SYNC_KEYS.forEach(function(k){ try{ var v = localStorage.getItem(k); if(v!==null) doc[k] = v; }catch(e){} });
        window.__cloud.setCloudDoc(u.uid, doc);
      }).catch(function(){});
    }catch(e){}
  }

  function overlay(){ var d=document.createElement('div'); d.style.cssText='position:fixed;inset:0;background:rgba(15,23,42,.55);z-index:99999;display:flex;align-items:center;justify-content:center;padding:16px;font-family:inherit;'; return d; }
  function card(){ var d=document.createElement('div'); d.style.cssText='background:#fff;border-radius:16px;padding:20px;max-width:360px;width:100%;box-shadow:0 20px 60px -20px rgba(0,0,0,.4);max-height:90vh;overflow-y:auto;'; return d; }
  function h(tag, style, text){ var e=document.createElement(tag); if(style) e.style.cssText=style; if(text!=null) e.textContent=text; return e; }
  function btn(text, primary){ var b=document.createElement('button'); b.textContent=text; b.style.cssText='width:100%;padding:12px;border-radius:10px;font-weight:700;font-size:14px;margin-top:8px;border:none;cursor:pointer;'+(primary?'background:#1d4ed8;color:#fff;':'background:#f3f4f6;color:#111827;'); return b; }
  function input(placeholder, type){ var i=document.createElement('input'); i.placeholder=placeholder; i.type=type||'text'; i.autocomplete='off'; i.style.cssText='width:100%;padding:12px;border-radius:10px;border:1px solid #e5e7eb;font-size:15px;margin-top:10px;box-sizing:border-box;'; return i; }
  function closeOn(ov){ ov.addEventListener('click', function(e){ if(e.target===ov) ov.remove(); }); }
  function errBox(){ return h('p','color:#dc2626;font-size:13px;margin-top:8px;display:none;'); }

  // ================= FEATURE A: Forgot password (Sign in/up) =================
  function findLoginToggleBtn(){
    var btns = document.querySelectorAll('button');
    for (var i=0;i<btns.length;i++){
      var tx = btns[i].textContent||'';
      if (tx.indexOf('Already have an account') !==-1 || tx.indexOf('New here?')!==-1) return btns[i];
    }
    return null;
  }
  function ensureForgotLink(){
    var toggleBtn = findLoginToggleBtn();
    if(!toggleBtn || !toggleBtn.parentNode) return;
    if(toggleBtn.parentNode.querySelector('[data-zmp-forgot]')) return;
    var link = document.createElement('button');
    link.setAttribute('data-zmp-forgot','1');
    link.textContent = 'Forgot password?';
    link.style.cssText='width:100%;padding:6px;margin-top:2px;background:none;border:none;color:#6b7280;font-size:13px;font-weight:600;text-decoration:underline;cursor:pointer;';
    link.addEventListener('click', function(ev){ ev.preventDefault(); openForgotFlow(); });
    toggleBtn.parentNode.insertBefore(link, toggleBtn.nextSibling);
  }
  function openForgotFlow(){
    var ov=overlay(), c=card();
    function draw(){
      c.innerHTML='';
      c.appendChild(h('h3','font-size:16px;font-weight:800;margin:0 0 4px;color:#111827;','Reset account password'));
      c.appendChild(h('p','font-size:13px;color:#6b7280;margin:0 0 4px;','We’ll email you a link to set a new password.'));
      var email = input('Your email','email');
      var err = errBox();
      var send = btn('Send reset link', true);
      var cancel = btn('Cancel', false);
      send.addEventListener('click', function(){
        var v=email.value.trim();
        if(!v){ err.textContent='Please enter your email.'; err.style.display='block'; return; }
        if(!window.__cloud || !window.__cloud.resetPasswordForEmail){ err.textContent='Cloud is not ready yet, try again in a moment.'; err.style.display='block'; return; }
        send.disabled=true; send.textContent='Sending...';
        window.__cloud.resetPasswordForEmail(v).then(function(){
          c.innerHTML='';
          c.appendChild(h('h3','font-size:16px;font-weight:800;margin:0 0 8px;color:#111827;','Check your email'));
          c.appendChild(h('p','font-size:13px;color:#6b7280;margin:0;','We sent a password reset link to '+v+'. Open it on this device to set a new password.'));
          var ok=btn('Close', true); ok.addEventListener('click', function(){ ov.remove(); }); c.appendChild(ok);
        }).catch(function(e){
          send.disabled=false; send.textContent='Send reset link';
          err.textContent = (e&&e.message) || 'Something went wrong.'; err.style.display='block';
        });
      });
      cancel.addEventListener('click', function(){ ov.remove(); });
      c.appendChild(email); c.appendChild(err); c.appendChild(send); c.appendChild(cancel);
    }
    draw();
    ov.appendChild(c); closeOn(ov); document.body.appendChild(ov);
  }
  function openSetNewPasswordFlow(){
    var ov=overlay(), c=card();
    c.appendChild(h('h3','font-size:16px;font-weight:800;margin:0 0 4px;color:#111827;','Set a new password'));
    c.appendChild(h('p','font-size:13px;color:#6b7280;margin:0 0 4px;','Choose a new password for your account login.'));
    var pw = input('New password (min 6 chars)','password');
    var err = errBox();
    var save = btn('Save new password', true);
    save.addEventListener('click', function(){
      var v=pw.value;
      if(!v || v.length<6){ err.textContent='Password must be at least 6 characters.'; err.style.display='block'; return; }
      save.disabled=true; save.textContent='Saving...';
      window.__cloud.updatePassword(v).then(function(){
        c.innerHTML='';
        c.appendChild(h('h3','font-size:16px;font-weight:800;margin:0 0 8px;color:#111827;','Password updated'));
        c.appendChild(h('p','font-size:13px;color:#6b7280;margin:0;','Your account password has been changed. Use it next time you sign in.'));
        var ok=btn('Continue', true); ok.addEventListener('click', function(){ ov.remove(); }); c.appendChild(ok);
      }).catch(function(e){
        save.disabled=false; save.textContent='Save new password';
        err.textContent=(e&&e.message)||'Something went wrong.'; err.style.display='block';
      });
    });
    c.appendChild(pw); c.appendChild(err); c.appendChild(save);
    ov.appendChild(c); document.body.appendChild(ov);
  }
  window.addEventListener('__cloud_recovery__', function(){ openSetNewPasswordFlow(); });

  // ================= FEATURE B: Reset Master Password / Owner PIN =================
  function findSignOutBtn(){
    var btns=document.querySelectorAll('button');
    for(var i=0;i<btns.length;i++){ if((btns[i].textContent||'').trim()==='Sign out') return btns[i]; }
    return null;
  }
  function ensureResetMenuItems(){
    var signOut = findSignOutBtn();
    if(!signOut || !signOut.parentNode) return;
    var menuRoot = signOut.parentNode;
    if(menuRoot.querySelector('[data-zmp-reset-master]')) return;
    function makeItem(id, label, sub){
      var b=document.createElement('button');
      b.setAttribute('data-zmp-'+id,'1');
      b.style.cssText='width:100%;display:flex;align-items:center;gap:12px;padding:12px;border-radius:12px;border:none;background:none;text-align:left;cursor:pointer;margin-top:4px;';
      var icon=h('div','width:40px;height:40px;border-radius:12px;background:#eff6ff;color:#1d4ed8;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-weight:800;font-size:16px;','↺');
      var txtWrap=document.createElement('div');
      txtWrap.appendChild(h('p','font-weight:700;color:#111827;font-size:14px;margin:0;',label));
      txtWrap.appendChild(h('p','font-size:12px;color:#9ca3af;margin:0;',sub));
      b.appendChild(icon); b.appendChild(txtWrap);
      return b;
    }
    var item1 = makeItem('reset-master','Reset Master Password','Change password');
    var item2 = makeItem('reset-pin','Reset Owner PIN','Change PIN');
    item1.addEventListener('click', function(){ openResetFlow('zmp.edit.auth.v1','Master Password'); });
    item2.addEventListener('click', function(){ openResetFlow('zmp.owner.auth.v1','Owner PIN'); });
    menuRoot.insertBefore(item1, signOut);
    menuRoot.insertBefore(item2, signOut);
  }
  function openResetFlow(storageKey, label){
    var ov=overlay(), c=card();
    var step=1;
    function render(){
      c.innerHTML='';
      c.appendChild(h('h3','font-size:16px;font-weight:800;margin:0 0 4px;color:#111827;','Reset '+label));
      if(step===1){
        c.appendChild(h('p','font-size:13px;color:#6b7280;margin:0 0 6px;','Enter your new password below to continue.'));
        c.appendChild(h('p','font-size:12px;font-weight:700;color:#374151;margin:10px 0 2px;','Input your New Password.'));
        var p1=input('New Password','password');
        c.appendChild(p1);
        c.appendChild(h('p','font-size:12px;font-weight:700;color:#374151;margin:10px 0 2px;','Confirm Again.'));
        var p2=input('Confirm Password','password');
        c.appendChild(p2);
        var err=errBox();
        var go=btn('Verify', true); var cancel=btn('Cancel', false);
        c.appendChild(err); c.appendChild(go); c.appendChild(cancel);
        go.addEventListener('click', function(){
          var a=(p1.value||'').trim().toLowerCase();
          var b2=(p2.value||'').trim().toLowerCase();
          if(a==='new' && b2==='again'){ step=2; render(); return; }
          err.textContent='Incorrect password. Please try again.'; err.style.display='block';
          p1.value=''; p2.value='';
        });
        cancel.addEventListener('click', function(){ ov.remove(); });
      } else if(step===2){
        c.appendChild(h('p','font-size:13px;color:#6b7280;margin:0 0 4px;','Choose a new 4-digit '+label.toLowerCase()+'.'));
        var p3=input('New 4-digit PIN','password'); p3.maxLength=4;
        var p4=input('Confirm PIN','password'); p4.maxLength=4;
        var err3=errBox();
        var save=btn('Save '+label, true);
        save.addEventListener('click', function(){
          var a=p3.value.trim(), b2=p4.value.trim();
          if(!/^\d{4}$/.test(a)){ err3.textContent='PIN must be exactly 4 digits.'; err3.style.display='block'; return; }
          if(a!==b2){ err3.textContent='PINs do not match.'; err3.style.display='block'; return; }
          try{ localStorage.setItem(storageKey, JSON.stringify({hash: djb2(a)})); }catch(e){}
          pushSyncNow();
          c.innerHTML='';
          c.appendChild(h('h3','font-size:16px;font-weight:800;margin:0 0 8px;color:#111827;',label+' updated'));
          c.appendChild(h('p','font-size:13px;color:#6b7280;margin:0;','Your '+label.toLowerCase()+' has been reset. Use the new PIN next time it\u2019s asked for.'));
          var ok=btn('Done', true); ok.addEventListener('click', function(){ ov.remove(); }); c.appendChild(ok);
        });
        c.appendChild(p3); c.appendChild(p4); c.appendChild(err3); c.appendChild(save);
      }
    }
    render();
    ov.appendChild(c); closeOn(ov); document.body.appendChild(ov);
  }// ================= FEATURE C: PDF statement download in Party Detail =================
  var jsPDFReady=null;
  function loadJsPDF(){
    if(jsPDFReady) return jsPDFReady;
    jsPDFReady = import('https://cdn.jsdelivr.net/npm/jspdf@2.5.1/+esm').then(function(m){ return m.jsPDF; });
    return jsPDFReady;
  }
  function findPartyDetailRoot(){
    var addBill=null, addPayment=null;
    var btns=document.querySelectorAll('button');
    for(var i=0;i<btns.length;i++){
      var tx=(btns[i].textContent||'').trim();
      if(tx.indexOf('Add Bill')!==-1) addBill=btns[i];
      if(tx.indexOf('Add Payment')!==-1) addPayment=btns[i];
    }
    if(!addBill || !addPayment) return null;
    var node = addPayment;
    for(var d=0; d<8 && node; d++){
      if(node.contains(addBill)) return node;
      node = node.parentElement;
    }
    return addPayment.parentElement;
  }
  function ensurePdfButton(){
    var root = findPartyDetailRoot();
    if(!root || !root.parentNode) return;
    if(root.parentNode.querySelector('[data-zmp-pdf-btn]')) return;
    var b=document.createElement('button');
    b.setAttribute('data-zmp-pdf-btn','1');
    b.textContent='⬇ Download PDF Statement';
    b.style.cssText='display:block;width:100%;padding:10px;border-radius:10px;background:#111827;color:#fff;font-weight:700;font-size:13px;border:none;cursor:pointer;margin:8px 0;';
    b.addEventListener('click', function(){ downloadStatementPdf(root); });
    root.parentNode.insertBefore(b, root);
  }
  function textOf(el){ return (el && el.textContent || '').replace(/\s+/g,' ').trim(); }
  function findModalPanel(root){
    var node = root;
    for(var d=0; d<10 && node; d++){
      var t = node.textContent||'';
      if (t.indexOf('Total Bill') !== -1 && t.indexOf('Total Bill') > 0) return node;
      node = node.parentElement;
    }
    // fallback: just go up two levels from the buttons row (header + body wrapper)
    return (root.parentElement && root.parentElement.parentElement) ? root.parentElement.parentElement : root;
  }
  function rupToRs(s){ return (s||'').replace(/₹/g,'Rs. ').replace(/−/g,'-'); }
  function parseSummary(container){
    var card = container.querySelector('.bg-gray-50.rounded-2xl');
    var map = {};
    if(card){
      var ps = card.querySelectorAll('p');
      for(var i=0;i<ps.length;i+=2){
        var label = ps[i] ? ps[i].textContent.trim() : '';
        var value = ps[i+1] ? ps[i+1].textContent.trim() : '';
        if(label) map[label]=rupToRs(value);
      }
    }
    return map;
  }
  function collectEntries(container){
    var rows = container.querySelectorAll('div.rounded-xl.p-3.flex.items-center.gap-3.mb-2');
    var list = [];
    rows.forEach(function(row){
      var group = row.closest('.mb-4');
      var dateHeader = group ? group.querySelector('p.text-xs.font-bold.text-gray-400') : null;
      var dateText = dateHeader ? dateHeader.textContent.trim() : '';
      var isBill = !!row.querySelector('.bg-red-50');
      var titleP = row.querySelector('p.text-sm.font-semibold.text-gray-800');
      var titleText = titleP ? titleP.textContent.replace(/\s+/g,' ').trim() : '';
      var amtPs = row.querySelectorAll('p.font-bold.text-sm');
      var amtText = amtPs.length ? amtPs[amtPs.length-1].textContent.trim() : '';
      var infoDiv = row.querySelector('.min-w-0.flex-1');
      var badgeEls = infoDiv ? infoDiv.querySelectorAll('span') : [];
      var badgeParts = [];
      badgeEls.forEach(function(sp){
        var bt = (sp.textContent||'').replace(/\s+/g,' ').trim();
        if(bt) badgeParts.push(rupToRs(bt));
      });
      var extra = badgeParts.join(', ');
      var noMatch = titleText.match(/No\.(\d+)/);
      var no = noMatch ? noMatch[1] : '';
      var parts = titleText.split(/—|−|—/);
      var note = parts.length>1 ? parts.slice(1).join(' ').trim() : '';
      var details = [note, extra].filter(Boolean).join(' · ');
      list.push({date:dateText, isBill:isBill, no:no, details:details, amount:rupToRs(amtText)});
    });
    return list;
  }
  function fitLine(doc, txt, maxW){
    txt = String(txt||'');
    var lines = doc.splitTextToSize(txt, maxW);
    if(lines.length<=1) return lines[0]||'';
    return (lines[0]||'').replace(/\s+\S*$/, '') + '…';
  }
  function downloadStatementPdf(root){
    var container = findModalPanel(root);
    var fullText = textOf(container);
    var idx = fullText.indexOf('Total Bill');
    var partyName = idx > 0 ? fullText.slice(0, idx).trim() : 'Party';
    var summary = parseSummary(container);
    var entries = collectEntries(container);

    loadJsPDF().then(function(jsPDF){
      var doc = new jsPDF();
      var pageW = doc.internal.pageSize.getWidth();
      var pageH = doc.internal.pageSize.getHeight();
      var marginX = 14;
      var innerW = pageW - marginX*2;

      // ---- Header band ----
      doc.setFillColor(17,24,39);
      doc.rect(0,0,pageW,30,'F');
      doc.setTextColor(255,255,255);
      doc.setFont(undefined,'bold'); doc.setFontSize(15);
      doc.text('Zubair Motor Parts & Accessories', marginX, 13);
      doc.setFont(undefined,'normal'); doc.setFontSize(10.5);
      doc.text('Statement for: '+partyName, marginX, 20);
      doc.setFontSize(8.5); doc.setTextColor(209,213,219);
      doc.text('Generated: '+new Date().toLocaleString('en-IN'), marginX, 26);

      var y = 38;

      // ---- Summary cards ----
      var cards = [];
      if(summary['Total Bill']) cards.push({label:'Total Bill', value:summary['Total Bill'], fill:[254,242,242], text:[185,28,28]});
      if(summary['Actual Paid']) cards.push({label:'Total Paid', value:summary['Actual Paid'], fill:[240,253,244], text:[21,128,61]});
      if(summary['Due']) cards.push({label:'Due', value:summary['Due'], fill:[255,247,237], text:[194,65,12]});
      else if(summary['Advance']) cards.push({label:'Advance', value:summary['Advance'], fill:[240,253,244], text:[21,128,61]});
      else if(summary['Status']) cards.push({label:'Status', value:summary['Status'], fill:[240,253,244], text:[21,128,61]});
      if(summary['Adjustment']) cards.push({label:'Round-off / Adj.', value:summary['Adjustment'], fill:[239,246,255], text:[29,78,216]});
      if(summary['Total Settled']) cards.push({label:'Total Settled', value:summary['Total Settled'], fill:[249,250,251], text:[55,65,81]});

      var n = cards.length || 1;
      var gap = 3;
      var cardW = (innerW - gap*(n-1)) / n;
      var cardH = 18;
      cards.forEach(function(cd, i){
        var x = marginX + i*(cardW+gap);
        doc.setFillColor(cd.fill[0],cd.fill[1],cd.fill[2]);
        doc.roundedRect(x, y, cardW, cardH, 2, 2, 'F');
        doc.setTextColor(107,114,128); doc.setFont(undefined,'normal'); doc.setFontSize(7.3);
        doc.text(fitLine(doc, cd.label, cardW-6), x+3, y+6);
        doc.setTextColor(cd.text[0],cd.text[1],cd.text[2]); doc.setFont(undefined,'bold'); doc.setFontSize(9.5);
        doc.text(fitLine(doc, cd.value, cardW-6), x+3, y+13.5);
      });
      y += cardH + 10;

      // ---- Table ----
      var cols = [
        {key:'date', label:'Date', w:26},
        {key:'type', label:'Type', w:18},
        {key:'no', label:'No.', w:14},
        {key:'details', label:'Details', w: innerW-26-18-14-40},
        {key:'amount', label:'Amount', w:40}
      ];
      function drawTableHeader(yy){
        doc.setFillColor(17,24,39);
        doc.rect(marginX, yy, innerW, 8, 'F');
        doc.setTextColor(255,255,255); doc.setFont(undefined,'bold'); doc.setFontSize(8.5);
        var cx = marginX;
        cols.forEach(function(c){
          var align = c.key==='amount' ? 'right':'left';
          var tx = align==='right' ? cx+c.w-2 : cx+2;
          doc.text(c.label, tx, yy+5.5, {align: align});
          cx += c.w;
        });
        return yy+8;
      }
      y = drawTableHeader(y);
      doc.setFont(undefined,'normal'); doc.setFontSize(8.5);

      if(entries.length===0){
        doc.setTextColor(107,114,128);
        doc.text('No bills or payments recorded yet.', marginX+2, y+7);
        y += 12;
      }

      entries.forEach(function(en){
        var rowH = 8;
        if(y + rowH > pageH - 16){
          doc.addPage();
          y = 16;
          y = drawTableHeader(y);
          doc.setFont(undefined,'normal'); doc.setFontSize(8.5);
        }
        var fill = en.isBill ? [254,242,242] : [240,253,244];
        var textCol = en.isBill ? [185,28,28] : [21,128,61];
        doc.setFillColor(fill[0],fill[1],fill[2]);
        doc.rect(marginX, y, innerW, rowH, 'F');
        var cx = marginX;
        var vals = {
          date: en.date,
          type: en.isBill ? 'Bill' : 'Payment',
          no: en.no,
          details: en.details || '—',
          amount: en.amount
        };
        cols.forEach(function(c){
          var align = c.key==='amount' ? 'right':'left';
          var tx = align==='right' ? cx+c.w-2 : cx+2;
          if(c.key==='amount' || c.key==='type'){
            doc.setTextColor(textCol[0],textCol[1],textCol[2]); doc.setFont(undefined,'bold');
          } else {
            doc.setTextColor(31,41,55); doc.setFont(undefined,'normal');
          }
          doc.text(fitLine(doc, vals[c.key], c.w-4), tx, y+5.5, {align: align});
          cx += c.w;
        });
        y += rowH;
      });

      // ---- Footer page numbers ----
      var pageCount = doc.internal.getNumberOfPages();
      for(var p=1;p<=pageCount;p++){
        doc.setPage(p);
        doc.setFontSize(7.5); doc.setTextColor(156,163,175); doc.setFont(undefined,'normal');
        doc.text('Zubair Motor Parts & Accessories · Page '+p+' of '+pageCount, pageW/2, pageH-8, {align:'center'});
      }

      var stamp = (function(){ var d=new Date(); return d.getFullYear()+String(d.getMonth()+1).padStart(2,'0')+String(d.getDate()).padStart(2,'0'); })();
      var fname = ('Statement_'+partyName+'_'+stamp).replace(/[^a-z0-9_\-]/gi,'_')+'.pdf';
      doc.save(fname);
    }).catch(function(){ alert('Could not load the PDF generator. Check your internet connection and try again.'); });
  }

  var mo = new MutationObserver(function(){
    ensureForgotLink();
    ensureResetMenuItems();
    ensurePdfButton();
  });
  mo.observe(document.documentElement, { childList:true, subtree:true });
  function boot(){ ensureForgotLink(); ensureResetMenuItems(); ensurePdfButton(); }
  if(document.readyState==='complete' || document.readyState==='interactive') boot();
  else document.addEventListener('DOMContentLoaded', boot);
})();

</script>
</body>
</html>
