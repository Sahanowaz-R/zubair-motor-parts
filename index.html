          if (error) throw error;
          return data ? data.data : null;
        },
        setCloudDoc: async (uid, data) => {
          const { error } = await supabase.from('app_data').upsert({ user_id: uid, data, updated_at: new Date().toISOString() });
          if (error) throw error;
        },
      };
      window.dispatchEvent(new Event('__cloud_ready__'));
    }).catch((e) => { console.error('Supabase failed to load', e); window.__CLOUD_CONFIGURED__ = false; window.dispatchEvent(new Event('__cloud_ready__')); });
  } else {
    window.dispatchEvent(new Event('__cloud_ready__'));
  }
</script>
